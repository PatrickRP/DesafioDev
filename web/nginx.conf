server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o upstream numa variável, o nginx resolve "api" a cada
    # requisição (cache de 10s) em vez de só na subida: se o contêiner da API for recriado
    # e mudar de IP, o proxy continua funcionando sem reiniciar o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # Mesmo papel do proxy.conf.json no `ng serve`: o browser só fala com esta origem, sem CORS.
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JS e CSS do build têm hash no nome: podem ficar em cache para sempre.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca em cache: é ele que aponta para os arquivos com hash da versão nova.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rotas do Angular (/estoque, /juros): F5 ou link direto devolvem o index.html
    # e o roteador do front resolve. Sem isso, o nginx responderia 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
